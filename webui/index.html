<script>
  // 主题预加载：避免闪烁
  (function () {
    try {
      var t = localStorage.getItem("quantx_theme") || "dark";
      if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      if (t === "light") { var m = document.querySelector("meta[name=theme-color]"); if (m) m.setAttribute("content", "#f1f4f9"); }
    } catch (e) {}
  })();
</script>
