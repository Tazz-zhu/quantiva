name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Build source archives
        run: |
          mkdir -p dist
          tar --exclude='.git' --exclude='data' --exclude='reports/runs' --exclude='__pycache__' --exclude='*.pyc' --exclude='dist' -czf dist/quantiva-${{ github.ref_name }}.tar.gz .
          zip -r dist/quantiva-${{ github.ref_name }}.zip . -x ".git/*" "data/*" "reports/runs/*" "__pycache__/*" "*.pyc" "dist/*"

      - name: Extract changelog for tag
        id: notes
        run: |
          python - <<'EOF'
          import re
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'## \[([^\]]+)\] - .*?\n(.*?)(?=\n## \[|\Z)', text, re.S)
          body = m.group(2).strip() if m else 'See CHANGELOG.md'
          open('release_body.md', 'w', encoding='utf-8').write(body)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            dist/quantiva-*.tar.gz
            dist/quantiva-*.zip
