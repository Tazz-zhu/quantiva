<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    background:
      radial-gradient(1200px 900px at 50% 18%, rgba(76,141,255,0.22), rgba(76,141,255,0) 60%),
      radial-gradient(900px 700px at 85% 82%, rgba(124,92,255,0.20), rgba(124,92,255,0) 60%),
      radial-gradient(700px 500px at 12% 88%, rgba(34,197,94,0.10), rgba(34,197,94,0) 60%),
      #05070d;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(1200px 900px at 50% 18%, rgba(76,141,255,0.22), rgba(76,141,255,0) 60%),
      radial-gradient(900px 700px at 85% 82%, rgba(124,92,255,0.20), rgba(124,92,255,0) 60%),
      radial-gradient(700px 500px at 12% 88%, rgba(34,197,94,0.10), rgba(34,197,94,0) 60%),
      #05070d;
    background-size: 54px 54px, 54px 54px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    color:#fff;
    position:relative;
  }
  .wrap { position:relative; height:100%; display:flex; flex-direction:column; align-items:center; padding:110px 70px 90px; }
  .pill {
    display:inline-flex; align-items:center; gap:14px; padding:16px 34px; border-radius:999px;
    background:rgba(76,141,255,0.10); border:1.5px solid rgba(76,141,255,0.45);
    color:#a9c7ff; font-size:28px; letter-spacing:6px; font-weight:600;
    box-shadow:0 0 40px rgba(76,141,255,0.25), inset 0 0 20px rgba(76,141,255,0.08);
  }
  .dot { width:14px; height:14px; border-radius:50%; background:#22c55e; box-shadow:0 0 18px #22c55e; }
  .icon { margin-top:74px; filter:drop-shadow(0 20px 60px rgba(76,141,255,0.45)); }
  h1 {
    margin-top:56px; font-size:104px; font-weight:900; letter-spacing:4px; line-height:1.18; text-align:center;
  }
  h1 .grad {
    background:linear-gradient(100deg,#6ea8ff 0%, #4c8dff 30%, #8f6bff 70%, #c084fc 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand { margin-top:26px; font-size:34px; letter-spacing:14px; color:#8b94a7; font-weight:600; }
  .tagline { margin-top:40px; font-size:40px; color:#c7d2e0; letter-spacing:2px; font-weight:500; }
  .tagline b { color:#6ea8ff; }
  .chips { margin-top:48px; display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
  .chip {
    padding:16px 30px; border-radius:18px; font-size:30px; font-weight:600; color:#e8eef7;
    background:rgba(255,255,255,0.055); border:1px solid rgba(255,255,255,0.12);
    backdrop-filter:blur(4px);
  }
  .chip.g { border-color:rgba(34,197,94,0.5); color:#7ee2a0; background:rgba(34,197,94,0.08); }
  .chip.p { border-color:rgba(124,92,255,0.55); color:#b9a5ff; background:rgba(124,92,255,0.10); }
  .chart { margin-top:64px; filter:drop-shadow(0 30px 80px rgba(76,141,255,0.25)); }
  .floatcard {
    position:absolute; background:rgba(13,18,30,0.85); border:1px solid rgba(76,141,255,0.35);
    border-radius:22px; padding:22px 26px; backdrop-filter:blur(6px);
    box-shadow:0 18px 50px rgba(0,0,0,0.45);
  }
  .fc1 { left:66px; top:1050px; }
  .fc2 { right:60px; top:960px; }
  .fc3 { left:78px; top:1320px; }
  .fc .t { font-size:24px; color:#94a3b8; font-weight:600; }
  .fc .v { margin-top:6px; font-size:40px; font-weight:800; }
  .fc .v.up { color:#22c55e; } .fc .v.grad { background:linear-gradient(90deg,#6ea8ff,#c084fc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .cta {
    margin-top:56px; display:flex; align-items:center; gap:24px; padding:34px 60px; border-radius:999px;
    background:linear-gradient(100deg,#3d7bff,#6b4dff);
    box-shadow:0 24px 80px rgba(76,141,255,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
    font-size:44px; font-weight:800; letter-spacing:2px;
  }
  .cta .arrow { font-size:48px; }
  .foot { margin-top:34px; font-size:26px; color:#64748b; letter-spacing:1px; }
  .corner { position:absolute; width:360px; height:360px; border-radius:50%; filter:blur(90px); opacity:0.5; }
  .c1 { left:-120px; top:-80px; background:#3d7bff; }
  .c2 { right:-140px; top:520px; background:#7c5cff; }
  .c3 { left:-100px; bottom:120px; background:#0f9d58; opacity:0.35; }
</style></head>
