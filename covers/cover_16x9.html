<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    color:#fff; position:relative;
    background:
      radial-gradient(1100px 700px at 25% 30%, rgba(76,141,255,0.22), rgba(76,141,255,0) 60%),
      radial-gradient(900px 700px at 85% 75%, rgba(124,92,255,0.20), rgba(124,92,255,0) 60%),
      #05070d;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(1100px 700px at 25% 30%, rgba(76,141,255,0.22), rgba(76,141,255,0) 60%),
      radial-gradient(900px 700px at 85% 75%, rgba(124,92,255,0.20), rgba(124,92,255,0) 60%),
      #05070d;
    background-size: 54px 54px, 54px 54px, 100% 100%, 100% 100%, 100% 100%;
  }
  .wrap { height:100%; display:flex; align-items:center; padding:0 120px; gap:90px; position:relative; }
  .left { flex:0 0 720px; }
  .pill { display:inline-flex; align-items:center; gap:12px; padding:12px 26px; border-radius:999px; background:rgba(76,141,255,0.10); border:1.5px solid rgba(76,141,255,0.45); color:#a9c7ff; font-size:24px; letter-spacing:5px; font-weight:600; }
  .dot { width:12px; height:12px; border-radius:50%; background:#22c55e; box-shadow:0 0 16px #22c55e; }
  .row { display:flex; align-items:center; gap:34px; margin-top:40px; }
  h1 { font-size:88px; font-weight:900; line-height:1.2; letter-spacing:2px; }
  h1 .grad { background:linear-gradient(100deg,#6ea8ff,#4c8dff 40%,#8f6bff 80%,#c084fc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand { margin-top:18px; font-size:28px; letter-spacing:12px; color:#8b94a7; font-weight:600; }
  .tagline { margin-top:30px; font-size:34px; color:#c7d2e0; }
  .tagline b { color:#6ea8ff; }
  .chips { margin-top:34px; display:flex; gap:16px; flex-wrap:wrap; }
  .chip { padding:14px 24px; border-radius:16px; font-size:26px; font-weight:600; background:rgba(255,255,255,0.055); border:1px solid rgba(255,255,255,0.12); }
  .chip.g { border-color:rgba(34,197,94,0.5); color:#7ee2a0; background:rgba(34,197,94,0.08); }
  .chip.p { border-color:rgba(124,92,255,0.55); color:#b9a5ff; background:rgba(124,92,255,0.10); }
  .right { flex:1; display:flex; flex-direction:column; align-items:center; gap:40px; }
  .cta { display:flex; align-items:center; gap:20px; padding:26px 48px; border-radius:999px; background:linear-gradient(100deg,#3d7bff,#6b4dff); box-shadow:0 22px 70px rgba(76,141,255,0.45); font-size:38px; font-weight:800; }
  .foot { font-size:22px; color:#64748b; }
  .corner { position:absolute; border-radius:50%; filter:blur(90px); opacity:0.5; }
  .c1 { left:-100px; top:-100px; width:380px; height:380px; background:#3d7bff; }
  .c2 { right:-120px; bottom:-120px; width:420px; height:420px; background:#7c5cff; }
</style></head>
<body>

</body></html>
